name: Add photos to collections

# Self-sustaining chain. Each run does up to 6 batches of 45 API calls, one per
# Unsplash hourly allowance (demo tier: 50 requests/hour), then starts the next
# run itself. GitHub's scheduler proved unreliable (1 scheduled run fired in 8
# hours), so the schedule below is only a backstop in case the chain breaks.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

concurrency:
  group: runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install -q --upgrade anthropic

      - name: Batches
        id: batches
        env:
          UNSPLASH_TOKEN: ${{ secrets.UNSPLASH_TOKEN }}
          # Workload identity federation: no stored key. These IDs are identifiers, not secrets.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01GAxMPKHQrVjVW85cS7j77h
          ANTHROPIC_ORGANIZATION_ID: 7e6bf58c-ef37-40fc-a5c5-c1d9c780e50d
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01JDzvtutJHaMAkTuZtbuLPZ
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-token
        run: |
          git config user.name "collections-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "finished=false" >> "$GITHUB_OUTPUT"
          get_oidc() {  # GitHub identity tokens expire within minutes, so mint a fresh one per batch
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase
            get_oidc
            FAILED=""
            if [ "$i" = 1 ]; then python sweep.py --selftest || { echo "::error::Anthropic auth self-test failed"; FAILED=1; }; fi
            # finds new uploads; reopens the plan (removes DONE) if there is work
            if [ -z "$FAILED" ] && [ ! -f PAUSED ]; then python sweep.py || { echo "::error::sweep reported errors"; FAILED=1; }; fi
            if [ -s sweep_comment.md ]; then
              N=$(gh issue list --search 'Sweep log in:title' --state open --json number -q '.[0].number')
              [ -n "$N" ] || N=$(gh issue create --title "Sweep log" --assignee bgood11 --body "Each comment is a daily sweep that filed new uploads into collections." | grep -o '[0-9]*$')
              gh issue comment "$N" --body-file sweep_comment.md && rm -f sweep_comment.md
            fi
            if [ -f DONE ] || [ -f PAUSED ]; then
              echo "DONE or PAUSED present, stopping"
              echo "finished=true" >> "$GITHUB_OUTPUT"
              if [ -n "$FAILED" ]; then
                git add -A; git diff --cached --quiet || git commit -q -m "Sweep state"
                git pull -q --rebase && git push -q
                echo "::error::sweep failed (see above)"; exit 1
              fi
              break
            fi
            USED=$(cat sweep_calls.txt 2>/dev/null || echo 0)
            BUDGET=$((45 - USED)) python runner.py | tee run.log
            if grep -q "PLAN COMPLETE" run.log; then date -u > DONE; fi
            git add -A
            git diff --cached --quiet || git commit -q -m "Progress: $(grep 'calls this run' run.log | cut -c1-120)"
            git pull -q --rebase && git push -q
            if [ -n "$FAILED" ]; then echo "::error::stopping so the failure is visible (GitHub emails failed runs)"; exit 1; fi
            if [ -f DONE ]; then
              echo "finished=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$i" -lt 6 ]; then
              echo "sleeping 61 minutes for the next hourly allowance"
              sleep 3660
            fi
          done

      - name: Start the next run
        if: steps.batches.outputs.finished == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run.yml --ref main
